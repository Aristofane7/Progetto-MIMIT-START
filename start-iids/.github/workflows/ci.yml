name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: start-iids

      - name: Lint
        run: ruff check src tests
        working-directory: start-iids

      - name: Unit + regression tests
        run: pytest --cov=src --cov-report=term-missing
        working-directory: start-iids

      - name: Guard against actuation endpoints (sec. 3.2)
        run: |
          if grep -rEn "/plc/write|/actuate|/setpoint/apply|/command/execute" src; then
            echo "Forbidden actuation endpoint found in v1 codebase." >&2
            exit 1
          fi
        working-directory: start-iids
