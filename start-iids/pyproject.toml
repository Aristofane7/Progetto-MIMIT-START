[project]
name = "start-iids"
version = "0.1.0"
description = "START Intelligent Industry Digital Shadow (IIDS) — Physical-to-Digital shadow engine (no automatic actuation)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires Depends()/Query() as argument
# defaults; this is the framework's documented usage, not a real mutable-default bug.
"src/api/app.py" = ["B008"]
