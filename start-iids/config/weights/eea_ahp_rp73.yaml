# Real RP7.3 AHP dimension weights, transcribed verbatim from
# data/reference/ahp_weights.xlsx (Weights_Consistency sheet). See ADR-012 and
# ADR-013.
#
# status: APPROVED — promoted from DRAFT by explicit project-owner decision
# (ADR-013, 2026-09-01), notwithstanding the source NOTE sheet's own
# "Matrice di confronto a coppie del panel — provvisoria, da confermare."
# Weights are used as published (they sum to 1.0001 due to 4-decimal rounding)
# rather than renormalized, to stay traceable to the source. Any future
# re-elicitation of the pairwise matrix must create a NEW weight_set_id.
