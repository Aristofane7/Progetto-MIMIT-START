  weight_set_id: EEA_AHP_RP73_1
  methodology: AHP
  version: "1.0"
  status: APPROVED
  approved_by: "Davide Settembre"
  approved_at: "2026-09-01"
  consistency_ratio: 0.0169  # CR <= 0.10 => CONSISTENTE, per the source sheet

weights:
  - dimension_code: env
    metric_code: ""
    weight_value: 0.3661
  - dimension_code: econ
    metric_code: ""
    weight_value: 0.1451
  - dimension_code: soc
    metric_code: ""
    weight_value: 0.0955
  - dimension_code: tech
